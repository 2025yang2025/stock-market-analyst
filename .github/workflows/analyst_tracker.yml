name: Analyst Performance Tracker

# 設定觸發時機
on:
  # 1. 定時自動執行 (Cron 語法，以 UTC 時間為準)
  # 範例：每週一到週五的台灣時間晚上 8 點 (UTC 12:00) 執行
  schedule:
    - cron: '38 01 * * 1-5'
  
  # 2. 允許在 GitHub 頁面上手動點擊按鈕觸發執行 (方便測試)
  workflow_dispatch:

  # 3. 當推程式碼到 main 分支時觸發
  push:
    branches:
      - main

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 檢查並下載專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: 安裝相依套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      # Step 4: 執行主程式並載入 Secrets 金鑰
      - name: Run Analyst Tracker Script
        env:
          # 從 GitHub Secrets 帶入設定好的變數
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
