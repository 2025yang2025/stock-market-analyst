name: Analyst Performance Tracker

# 設定觸發時機
on:
  # 1. 定時自動執行 (Cron 語法，以 UTC 時間為準)
  # 設定為台灣時間 (UTC+8) 每日 08:23 與 16:23 執行
  schedule:
    - cron: '23 0,8 * * *'
  
  # 2. 允許在 GitHub 頁面上手動點擊按鈕觸發執行 (方便測試)
  workflow_dispatch:

  # 3. 當推程式碼到 main 分支時觸發
  push:
    branches:
      - main

# 💡 賦予 GitHub Actions 寫入 repo 的權限 (用於將 recommendations.json commit 回去)
permissions:
  contents: write

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 檢查並下載專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: 安裝相依套件 (可根據 fetcher 需求補充 beautifulsoup4, requests 等)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4

      # Step 4: 執行爬蟲/自動化抓取腳本 (抓取最新推薦並更新 recommendations.json)
      - name: Run Fetcher Script
        run: |
          python fetch_recommendations.py

      # Step 5: 自動將更新後的 recommendations.json 提交 (Commit) 並 Push 回 GitHub
      - name: Commit & Push Updated JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add recommendations.json
          # 若 recommendations.json 有變動才 commit，避免無新資料時建出空 commit 報錯
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update recommendations.json" && git push)

      # Step 6: 執行勝率分析主程式並載入 Telegram Secrets 金鑰發送週報
      - name: Run Analyst Tracker Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
